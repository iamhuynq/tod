[project]
name = "qrs"
version = "0.1.0"
description = "Autonomous Quant Research System - crypto market research platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "arch>=7.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
qrs = "qrs.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["qrs"]
